<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIALTE | Mezcal Artesanal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            color: #f4f4f4;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 50px 30px;
            background: radial-gradient(circle, rgba(20,20,20,1) 0%, rgba(10,10,10,1) 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
        }
        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            letter-spacing: 6px;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .category {
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #a6a6a6;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .divider {
            width: 50px;
            height: 1px;
            background-color: #d4af37;
            margin: 0 auto 25px auto;
        }
        .slogan {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-style: italic;
            color: #e0e0e0;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }
        .status {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 8px 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="brand-name">MAYAHUELLI</h1>
        <p class="category">Mezcal Artesanal</p>
        <div class="divider"></div>
        <p class="slogan">"Donde la raíz se vuelve fuego"</p>
        <div class="status">Próximamente</div>
    </div>
</body>
</html>
